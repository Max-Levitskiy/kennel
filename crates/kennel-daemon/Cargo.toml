[package]
name = "kennel-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kenneld"
path = "src/main.rs"

[dependencies]
kennel-proto = { path = "../kennel-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
wasmtime = "24"

[dev-dependencies]
tempfile = "3"
