[package]
name = "kennel-daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kenneld"
path = "src/main.rs"

[dependencies]
kennel-proto = { path = "../kennel-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
wasmtime = "24"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"
core-graphics = "0.23"

[dev-dependencies]
tempfile = "3"
