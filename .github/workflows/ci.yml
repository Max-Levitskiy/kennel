name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build WASM fixtures
        run: cargo build --locked --release --target wasm32-unknown-unknown -p always-healthy -p unhealthy-then-fixed -p panics -p hangs -p emits-events
      - name: Test workspace
        run: cargo test --locked --workspace
